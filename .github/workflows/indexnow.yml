name: IndexNow

# After a successful GitHub Pages deployment of main, tell IndexNow (Bing and
# other participating engines) about new or changed page URLs only.
#
# The public key lives at /<32-hex-chars>.txt in the repo root. Its body is
# exactly that key. .nojekyll turns Jekyll off, and the filename is not
# underscore-prefixed, so GitHub Pages serves the file as plain text.
# No repository secrets are required.

on:
  workflow_run:
    workflows:
      - "pages build and deployment"
    types:
      - completed

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          python3 << 'PY'
          import json
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          SITE = "https://timursalakhetdinov.com"
          HOST = "timursalakhetdinov.com"
          HEAD = __import__("os").environ.get("HEAD_SHA", "HEAD").strip()
          REPO = __import__("os").environ.get("REPO", "").strip()

          def run(args):
              return subprocess.run(args, check=False, capture_output=True, text=True)

          def previous_sha():
              api = (
                  f"https://api.github.com/repos/{REPO}/actions/workflows/"
                  "pages-build-deployment/runs?branch=main&status=success&per_page=20"
              )
              try:
                  with urllib.request.urlopen(api, timeout=20) as resp:
                      data = json.load(resp)
                  for item in data.get("workflow_runs", []):
                      sha = item.get("head_sha") or ""
                      if sha and sha != HEAD:
                          print(f"Previous Pages deployment: {sha}")
                          return sha
              except Exception as exc:
                  print(f"Could not read previous Pages deployment ({exc}).")
              parent = run(["git", "rev-parse", f"{HEAD}^"])
              if parent.returncode == 0 and parent.stdout.strip():
                  print(f"Falling back to parent commit: {parent.stdout.strip()}")
                  return parent.stdout.strip()
              print("No previous commit; skipping IndexNow.")
              return ""

          def show(rev, path):
              result = run(["git", "show", f"{rev}:{path}"])
              return result.stdout if result.returncode == 0 else ""

          def locs(text):
              return re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", text)

          def sitemap_paths(text):
              found = set()
              for loc in locs(text):
                  if loc.startswith(SITE):
                      path = loc[len(SITE):] or "/"
                      if not path.startswith("/"):
                          path = "/" + path
                      found.add(path.rstrip("/") or "/")
              return found

          def to_public(rel, known):
              rel = rel.replace("\\", "/").lstrip("./")
              if rel == "index.html":
                  return SITE + "/"
              if rel.endswith("/index.html"):
                  return SITE + "/" + rel[: -len("index.html")]
              if rel.endswith(".html"):
                  stem = "/" + rel[:-5]
                  if stem.rstrip("/") in known or stem in known:
                      return SITE + stem
              return SITE + "/" + rel

          def loc_to_file(path):
              if path in ("", "/"):
                  return "index.html"
              trimmed = path.strip("/")
              if path.endswith("/"):
                  return f"{trimmed}/index.html"
              html_file = f"{trimmed}.html"
              if Path(html_file).is_file():
                  return html_file
              if Path(trimmed).is_file():
                  return trimmed
              index = f"{trimmed}/index.html"
              if Path(index).is_file():
                  return index
              return html_file

          def key_material():
              matches = []
              for path in Path(".").glob("*.txt"):
                  if not re.fullmatch(r"[0-9a-f]{32}", path.stem):
                      continue
                  raw = path.read_bytes()
                  if raw in (path.stem.encode(), path.stem.encode() + b"\n"):
                      matches.append(path)
              if len(matches) != 1:
                  print(f"Expected one IndexNow key file, found {len(matches)}; skipping.")
                  return None
              return matches[0].stem

          try:
              prev = previous_sha()
              if not prev:
                  raise SystemExit(0)
              diff = run(["git", "diff", "--name-only", "--diff-filter=AM", prev, HEAD])
              if diff.returncode != 0:
                  print(diff.stderr.strip() or "git diff failed; skipping IndexNow.")
                  raise SystemExit(0)
              changed = {line.strip() for line in diff.stdout.splitlines() if line.strip()}
              print("Changed paths:")
              for path in sorted(changed):
                  print(f"  {path}")
              sitemap_text = show(HEAD, "sitemap.xml")
              known = sitemap_paths(sitemap_text)
              urls = set()
              for path in sorted(changed):
                  if path.endswith(".html"):
                      urls.add(to_public(path, known))
              if "sitemap.xml" in changed:
                  old_locs = set(locs(show(prev, "sitemap.xml")))
                  for loc in locs(sitemap_text):
                      if not loc.startswith(SITE):
                          continue
                      path = loc[len(SITE):] or "/"
                      source = loc_to_file(path)
                      # Sitemap URLs are submitted only when that page changed
                      # or the URL itself was added. A lastmod-only edit is not enough.
                      if source in changed or loc not in old_locs:
                          urls.add(loc)
              ordered = sorted(urls)
              if not ordered:
                  print("No changed page URLs; skipping IndexNow request.")
                  raise SystemExit(0)
              key = key_material()
              if not key:
                  raise SystemExit(0)
              payload = {
                  "host": HOST,
                  "key": key,
                  "keyLocation": f"{SITE}/{key}.txt",
                  "urlList": ordered,
              }
              print("IndexNow urlList:")
              for url in ordered:
                  print(f"  {url}")
              body = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=body,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      snippet = response.read(500).decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  snippet = exc.read(500).decode("utf-8", "replace")
              print(f"IndexNow HTTP status: {status}")
              if snippet.strip():
                  print(snippet.strip())
          except SystemExit:
              pass
          except Exception as exc:
              print(f"IndexNow HTTP status: request failed ({exc})")
          raise SystemExit(0)
          PY
          exit 0
